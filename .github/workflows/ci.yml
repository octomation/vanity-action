name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    - cron: 0 7 1 * * # at 07:00 on day-of-month 1, UTC
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Testing
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with: { node-version: 24.22.3 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.1.0
        with: { go-version: 1.27.4, cache: false }

      - name: Run tests
        run: npm test

  # the action as a module's workflow runs it, on the fixture module checked
  # out at the workspace root; command entry reads the API, writes nothing
  action:
    name: Running the action
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the action
        uses: actions/checkout@v7.0.1
        with: { path: action, persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with: { node-version: 24.22.3 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.1.0
        with: { go-version: 1.27.4, cache: false }
      - name: Make the fixture the workspace checkout
        run: |
          cp -R action/tests/fixtures/module/. .
          git init --quiet --initial-branch main
          git add --all -- . ':!action'
          git -c user.name=ci -c user.email=ci@example.com commit --quiet --message fixture
          printf 'untracked\n' > untracked.go

      - name: Print the entry
        id: entry
        uses: ./action
        with:
          command: entry
          packages: all
          name: fixture
      - name: Compare the entry
        env:
          MODULE: ${{ steps.entry.outputs.module }}
          ENTRY_PATH: ${{ steps.entry.outputs.entry-path }}
        run: |
          [ "${MODULE}" = go.octolab.org/toolset/fixture ] || { echo "::error::module ${MODULE}"; exit 1; }
          [ "${ENTRY_PATH}" = modules/go.octolab.org/toolset/fixture.json ] || { echo "::error::entry-path ${ENTRY_PATH}"; exit 1; }
          node action/bin/vanity-action.mjs entry --path . --repository "${GITHUB_REPOSITORY}" \
            --branch main --visibility public --topics '' --packages all >"${RUNNER_TEMP}/entry.json"
          jq -e --slurpfile want action/tests/fixtures/module.packages.json --arg sha "$(git rev-parse HEAD)" \
            '.packages == $want[0] and .commit == $sha and .name == "vanity-action"' "${RUNNER_TEMP}/entry.json" >/dev/null \
            || { echo '::error::the entry differs from the fixture'; cat "${RUNNER_TEMP}/entry.json"; exit 1; }

  notify:
    name: Notifying
    needs: [ lint, test, action ]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
      && (failure() || success())

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: ⚙️
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
